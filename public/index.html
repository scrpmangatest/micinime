        body.lightmode .genre-tag {

            color: #333;

        }
        body.lightmode .genre-tag:hover {

        .desc-content {

            background: transparent;
            border-radius: 0;
            line-height: 1.75;
        }
        .desc-content h3 {

            font-weight: 700;

        body.lightmode .desc-content h3 { color: #333; }
        .desc-content p {

        /* Chapter List */
        .chapter-list {

        .chapter-item {
            display: flex;
            justify-content: space-between;
            align-items: center;

        .chapter-title { font-weight: 600; }

        /* Reader Page */
        .reader-container {

            margin: 0 auto;
            padding: 20px;
        }
        .reader-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;

        }
        .reader-nav a {

            border-radius: 8px;
            font-weight: 600;

        .reader-nav a:hover { opacity: 0.9; }
        .reader-nav a.disabled {

        .chapter-select {

            font-weight: 600;

        .bm-count {

<script>

function applyTheme(mode) {
    const isDark = mode !== 'lightmode';
    document.body.classList.toggle('darkmode', isDark);

    const toggle = document.getElementById('themeToggle');
    if (toggle) toggle.checked = isDark;
    localStorage.setItem('thememode', isDark ? 'darkmode' : 'lightmode');
    const sun = document.getElementById('themeSun');
    const moon = document.getElementById('themeMoon');
    if (sun) sun.style.opacity = isDark ? '0.45' : '1';
    if (moon) moon.style.opacity = isDark ? '1' : '0.45';
}

const savedTheme = localStorage.getItem('thememode') || 'darkmode';

// ===== Bookmark storage (localStorage + cookie backup) =====
const BM_KEY = 'kh_bookmarks';
const BM_MAX = 100;

const BookmarkStore = {
    getAll() {
        try {
            const raw = localStorage.getItem(BM_KEY);
            if (raw) {
                const arr = JSON.parse(raw);
                if (Array.isArray(arr)) return arr;
            }
        } catch (_) {}
        // cookie fallback
        try {
            const m = document.cookie.match(/(?:^|;\s*)kh_bookmarks=([^;]*)/);
            if (m) {
                const arr = JSON.parse(decodeURIComponent(m[1]));
                if (Array.isArray(arr)) return arr;
            }
        } catch (_) {}
        return [];
    },
    save(list) {
        const data = Array.isArray(list) ? list.slice(0, BM_MAX) : [];
        try {
            localStorage.setItem(BM_KEY, JSON.stringify(data));
        } catch (_) {}
        try {
            // lightweight cookie backup (may truncate if too large)
            const compact = data.map(x => ({
                slug: x.slug, title: x.title, url: x.url, image: x.image,
                chapter: x.chapter, rating: x.rating, addedAt: x.addedAt
            }));
            const val = encodeURIComponent(JSON.stringify(compact)).slice(0, 3500);
            document.cookie = `kh_bookmarks=${val};path=/;max-age=31536000;SameSite=Lax`;
        } catch (_) {}
        this.updateBadge();
        return data;
    },
    has(slug) {
        if (!slug) return false;
        return this.getAll().some(x => x.slug === slug);
    },
    add(item) {
        if (!item || !item.slug) return false;
        const list = this.getAll().filter(x => x.slug !== item.slug);
        list.unshift({
            slug: item.slug,
            title: item.title || item.slug,
            url: item.url || `/manga/${item.slug}`,
            image: item.image || null,
            chapter: item.chapter || null,
            rating: item.rating || null,
            addedAt: new Date().toISOString()
        });
        this.save(list);
        return true;
    },
    remove(slug) {
        const list = this.getAll().filter(x => x.slug !== slug);
        this.save(list);
        return true;
    },
    toggle(item) {
        if (this.has(item.slug)) {
            this.remove(item.slug);
            return false;
        }
        this.add(item);
        return true;
    },
    clear() {
        this.save([]);
    },
    updateBadge() {
        const n = this.getAll().length;
        const el = document.getElementById('bm-count');
        if (!el) return;
        if (n > 0) {
            el.style.display = 'inline';
            el.textContent = String(n);
        } else {
            el.style.display = 'none';
            el.textContent = '0';
        }
    }
};

// Global navigate function
function navigate(e, url) {
    if (e) e.preventDefault();
    if (!url || url === '#' || url.includes('#/')) return false;

    // Convert external absolute URL to local path
    let localUrl = String(url);
    try {
        if (localUrl.startsWith('http://') || localUrl.startsWith('https://')) {
            const u = new URL(localUrl);
            localUrl = u.pathname + u.search;
        }
    } catch (_) {
        localUrl = localUrl.replace(/^https?:\/\/[^/]+/i, '');
    }

    localUrl = localUrl.replace(/\/+$/, '') || '/';
    if (!localUrl.startsWith('/')) localUrl = '/' + localUrl;

    window.history.pushState({}, '', localUrl);
    router.routes();
    window.scrollTo(0, 0);
    return false;
}

function toggleBookmarkFromDetail(btn) {
    const item = {
        slug: btn.getAttribute('data-slug'),
        title: btn.getAttribute('data-title'),
        url: btn.getAttribute('data-url'),
        image: btn.getAttribute('data-image'),
        chapter: btn.getAttribute('data-chapter'),
        rating: btn.getAttribute('data-rating')
    };
    const nowBookmarked = BookmarkStore.toggle(item);
    btn.classList.toggle('active', nowBookmarked);
    btn.innerHTML = nowBookmarked
        ? '<i class="fas fa-bookmark"></i> Bookmarked'
        : '<i class="far fa-bookmark"></i> Bookmark';
    btn.title = nowBookmarked ? 'Hapus dari bookmark' : 'Tambah ke bookmark';
}

function removeBookmark(slug) {
    BookmarkStore.remove(slug);
    if (window.location.pathname.replace(/\/$/, '') === '/bookmark') {
        router.loadBookmarks();
    } else {
        BookmarkStore.updateBadge();
    }
}

// ===== History storage (localStorage + cookie backup) =====
const HS_KEY = 'kh_history';
const HS_MAX = 100;

const HistoryStore = {
    getAll() {
        try {
            const raw = localStorage.getItem(HS_KEY);
            if (raw) {
                const arr = JSON.parse(raw);
                if (Array.isArray(arr)) return arr;
            }
        } catch (_) {}
        try {
            const m = document.cookie.match(/(?:^|;\s*)kh_history=([^;]*)/);
            if (m) {
                const arr = JSON.parse(decodeURIComponent(m[1]));
                if (Array.isArray(arr)) return arr;
            }
        } catch (_) {}
        return [];
    },
    save(list) {
        const data = Array.isArray(list) ? list.slice(0, HS_MAX) : [];
        try {
            localStorage.setItem(HS_KEY, JSON.stringify(data));
        } catch (_) {}
        try {
            const compact = data.map(x => ({
                chapterSlug: x.chapterSlug,
                mangaSlug: x.mangaSlug,
                title: x.title,
                seriesTitle: x.seriesTitle,
                chapterTitle: x.chapterTitle,
                chapterUrl: x.chapterUrl,
                seriesUrl: x.seriesUrl,
                image: x.image,
                chapterNumber: x.chapterNumber,
                readAt: x.readAt
            }));
            const val = encodeURIComponent(JSON.stringify(compact)).slice(0, 3500);
            document.cookie = `kh_history=${val};path=/;max-age=31536000;SameSite=Lax`;
        } catch (_) {}
        this.updateBadge();
        return data;
    },
    add(item) {
        if (!item || !item.chapterSlug) return false;
        // Keep one entry per manga series (latest chapter read), plus unique by chapter
        let list = this.getAll().filter(x =>
            x.chapterSlug !== item.chapterSlug &&
            !(item.mangaSlug && x.mangaSlug === item.mangaSlug)
        );
        list.unshift({
            chapterSlug: item.chapterSlug,
            mangaSlug: item.mangaSlug || null,
            title: item.title || item.seriesTitle || item.chapterSlug,
            seriesTitle: item.seriesTitle || item.title || null,
            chapterTitle: item.chapterTitle || item.title || null,
            chapterUrl: item.chapterUrl || `/${item.chapterSlug}`,
            seriesUrl: item.seriesUrl || (item.mangaSlug ? `/manga/${item.mangaSlug}` : null),
            image: item.image || null,
            chapterNumber: item.chapterNumber != null ? item.chapterNumber : null,
            readAt: new Date().toISOString()
        });
        this.save(list);
        return true;
    },
    remove(chapterSlug) {
        const list = this.getAll().filter(x => x.chapterSlug !== chapterSlug);
        this.save(list);
        return true;
    },
    clear() {
        this.save([]);
    },
    updateBadge() {
        const n = this.getAll().length;
        const el = document.getElementById('hs-count');
        if (!el) return;
        if (n > 0) {
            el.style.display = 'inline';
            el.textContent = String(n);
        } else {
            el.style.display = 'none';
            el.textContent = '0';
        }
    },
    formatTime(iso) {
        if (!iso) return '';
        try {
            const d = new Date(iso);
            const now = new Date();
            const diff = Math.floor((now - d) / 1000);
            if (diff < 60) return 'baru saja';
            if (diff < 3600) return `${Math.floor(diff / 60)} menit lalu`;
            if (diff < 86400) return `${Math.floor(diff / 3600)} jam lalu`;
            if (diff < 604800) return `${Math.floor(diff / 86400)} hari lalu`;
            return d.toLocaleDateString('id-ID');
        } catch {
            return '';
        }
    }
};

function removeHistory(chapterSlug) {
    HistoryStore.remove(chapterSlug);
    if (window.location.pathname.replace(/\/$/, '') === '/history') {
        router.loadHistory();
    } else {
        HistoryStore.updateBadge();
    }
}

// Router object
const router = {
    contentEl: null,
    
    init() {
        this.contentEl = document.getElementById('appContent');
        this.routes();
    },
    
    routes() {
        let path = window.location.pathname || '/';
        // Fix accidental full-URL path: /https://domain/manga/slug
        if (path.includes('komikhentaiku.com') || path.includes('http')) {
            path = path.replace(/^\/+https?:\/+/, '/').replace(/komikhentaiku\.com/g, '');
            path = path.replace(/\/+/g, '/');
            window.history.replaceState({}, '', path + window.location.search);
        }
        path = path.replace(/\/$/, '') || '/';
        const searchParams = new URLSearchParams(window.location.search);

        if (path === '/') {
            if (searchParams.has('s')) {
                this.loadSearch(searchParams.get('s'));
            } else {
                this.loadHome(searchParams.get('page') || 1);
            }
        } else if (path === '/manga') {
            this.loadList(searchParams.get('page') || 1, searchParams.get('type') || 'manga');
        } else if (path === '/az-lists' || path === '/az-list' || path === '/az') {
            this.loadAZ(searchParams.get('show') || 'A', searchParams.get('page') || 1);
        } else if (path === '/genres' || path === '/genre') {
            this.loadGenres();
        } else if (path.startsWith('/genres/')) {
            const gslug = path.replace(/^\/genres\//, '').replace(/\/$/, '');
            this.loadGenreDetail(gslug, searchParams.get('page') || 1);
        } else if (path === '/bookmark' || path === '/bookmarks') {
            this.loadBookmarks();
        } else if (path === '/history' || path === '/histories') {
            this.loadHistory();
        } else if (path.startsWith('/manga/')) {
            const slug = path.replace(/^\/manga\//, '').replace(/\/$/, '');
            this.loadMangaDetail(slug);
        } else if (path.startsWith('/api/')) {
            // server API
        } else {
            const slug = path.replace(/^\//, '').replace(/\/$/, '');
            this.loadChapter(slug);
        }
    },

    async fetchJson(url) {
        const res = await fetch(url);
        const text = await res.text();
        try {
            return JSON.parse(text);
        } catch (e) {
            throw new Error('API error: expected JSON but got HTML. URL: ' + url);
        }
    },

    async loadHome(page = 1) {
        try {
            this.showLoading();
            page = Math.max(1, parseInt(page, 10) || 1);
            const data = await this.fetchJson(`/api/home?page=${page}`);
            this.renderHome(data);
        } catch (err) {
            console.error('Home error:', err);
            this.renderError(err.message);
        }
    },

    starHtml(score) {
        const n = Math.max(0, Math.min(10, parseFloat(score) || 0));
        const stars = n / 2; // 10-scale -> 5 stars
        let html = '';
        for (let i = 1; i <= 5; i++) {
            if (stars >= i) html += '<i class="fas fa-star"></i>';
            else if (stars >= i - 0.5) html += '<i class="fas fa-star-half-alt half"></i>';
            else html += '<i class="far fa-star empty"></i>';
        }
        return html;
    },

    cardPopular(item) {
        const rating = item.rating || '7.00';
        const genreHtml = (item.genres || []).slice(0, 3).map(g => {
            const name = typeof g === 'string' ? g : g.name || '';
            return `<span style="font-size:11px;padding:2px 6px;background:rgba(255,255,255,0.08);border-radius:3px;color:var(--text-secondary);white-space:nowrap;">${this.escapeHtml(name)}</span>`;
        }).join(' ');
        return `

                        </div>

                            ${genreHtml ? `<div style="display:flex;gap:3px;flex-wrap:wrap;margin:4px 0;">${genreHtml}</div>` : ''}
                            <div class="adds">
                                <div class="epxs">${this.escapeHtml(item.chapter || 'Chapter 1')}</div>
                                <div class="star-rating">

                                    <span class="numscore">${rating}</span>

                            </div>
                        </div>
                    </a>
                </div>
            </div>
        `;
    },

    cardLatest(item) {
        return `
            <div class="bs styletere">

                    <a href="#" data-url="${item.url}" class="nav-link" title="${this.escapeHtml(item.title)}">

                                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 285 425%22><rect fill=%22%23333%22 width=%22285%22 height=%22425%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23666%22 text-anchor=%22middle%22>No Image</text></svg>'">

    renderHome(data) {
        document.title = 'Micinime - Baca Manga & Manhwa Hentai Sub Indo Gratis';
        const page = parseInt(data.pagination?.currentPage || 1, 10) || 1;
        const totalPages = parseInt(data.pagination?.totalPages || 1, 10) || 1;
        const popularHTML = (data.popular || []).map(item => this.cardPopular(item)).join('');

        let start = Math.max(1, page - 2);

        if (end < totalPages) {

            pageBtns += `<button type="button" class="az-page-btn home-page-btn" data-page="${totalPages}">${totalPages}</button>`;

    async loadMangaDetail(slug) {

    renderDetail(data) {
        const genres = Array.isArray(data.genres) ? data.genres : [];
        const genresHTML = genres.map(g => {
            const name = typeof g === 'string' ? g : (g.name || '');
            if (!name) return '';
            const slug = name.toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            const href = (typeof g === 'object' && g.url && String(g.url).includes('/genres/'))
                ? g.url
                : `/genres/${slug}`;
            return `<a href="#" class="genre-tag nav-link" data-url="${href}">${this.escapeHtml(name)}</a>`;
        }).filter(Boolean).join('');

        // Sort chapters ascending: Chapter 1, 2, 3...
        const chapters = [...(data.chapters || [])].map((ch, i) => {
            const numMatch = String(ch.title || ch.url || '').match(/(?:chapter|ch\.?)\s*([0-9]+(?:\.[0-9]+)?)/i);
            return { ...ch, _num: numMatch ? parseFloat(numMatch[1]) : i + 1 };
        }).sort((a, b) => a._num - b._num);

        const firstChapter = chapters[0];
        const lastChapter = chapters[chapters.length - 1];
        const chaptersHTML = chapters.map(ch => `
            <div class="chapter-item">
                <a href="#" data-url="${ch.url}" class="chapter-title nav-link">${this.escapeHtml(ch.title)}</a>
                <span class="chapter-date">${ch.date || ''}</span>
            </div>
        `).join('');

        const slug = data.slug || (window.location.pathname.replace(/^\/manga\//, '').replace(/\/$/, ''));
        const isBm = BookmarkStore.has(slug);
        const firstTitle = firstChapter ? firstChapter.title : 'Chapter 1';

        this.contentEl.innerHTML = `
            <div class="bixbox">
                <div class="detail-container">
                    <div class="thumb-detail">
                        <img src="${this.proxyImg(data.image)}" alt="${this.escapeHtml(data.title)}" width="300" height="450"
                             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 300 450%22><rect fill=%22%23333%22 width=%22300%22 height=%22450%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23666%22 text-anchor=%22middle%22>No Image</text></svg>'">
                        <button type="button" class="btn-bookmark ${isBm ? 'active' : ''}" id="btnBookmark"
                            data-slug="${this.escapeHtml(slug)}"
                            data-title="${this.escapeHtml(data.title || '')}"
                            data-url="/manga/${this.escapeHtml(slug)}"
                            data-image="${this.escapeHtml(data.image || '')}"
                            data-chapter="${this.escapeHtml(firstTitle)}"
                            data-rating="${this.escapeHtml(String(data.rating || ''))}"
                            title="${isBm ? 'Hapus dari bookmark' : 'Tambah ke bookmark'}">
                            <i class="${isBm ? 'fas' : 'far'} fa-bookmark"></i>
                            ${isBm ? 'Bookmarked' : 'Bookmark'}
                        </button>
                        ${firstChapter ? `
                        <a href="#" data-url="${firstChapter.url}" class="nav-link" style="display:block;margin-top:10px;text-align:center;background:var(--primary-color);color:#fff;padding:12px;border-radius:8px;font-weight:700;">
                            Baca Chapter 1
                        </a>` : ''}
                    </div>
                    <div class="info-desc">
                        <h1>${this.escapeHtml(data.title)}</h1>

                        ${genresHTML ? `<div class="genre-list">${genresHTML}</div>` : ''}

                        <div class="info-meta">
                            ${data.rating ? `<p><strong>Rating:</strong> ${this.escapeHtml(String(data.rating))}/10</p>` : ''}
                            ${data.status ? `<p><strong>Status:</strong> ${this.escapeHtml(data.status)}</p>` : ''}
                            ${data.type ? `<p><strong>Type:</strong> ${this.escapeHtml(data.type)}</p>` : ''}
                        </div>

                        ${data.description ? `
                        <div class="desc-content">
                            <h3>Synopsis ${this.escapeHtml(data.title)}</h3>
                            <p>${this.escapeHtml(data.description)}</p>
                        </div>` : ''}

                        <div class="chapter-list">
                            <div class="releases">
                                <h2>Chapter ${this.escapeHtml(data.title)}</h2>
                            </div>
                            ${firstChapter || lastChapter ? `
                            <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;">
                                ${firstChapter ? `<a href="#" data-url="${firstChapter.url}" class="nav-link" style="flex:1;min-width:140px;text-align:center;background:#2a2a3a;color:#fff;padding:12px;border-radius:8px;font-weight:600;"><div style="font-size:12px;opacity:.7;">First Chapter</div><div>${this.escapeHtml(firstChapter.title)}</div></a>` : ''}
                                ${lastChapter ? `<a href="#" data-url="${lastChapter.url}" class="nav-link" style="flex:1;min-width:140px;text-align:center;background:#2a2a3a;color:#fff;padding:12px;border-radius:8px;font-weight:600;"><div style="font-size:12px;opacity:.7;">New Chapter</div><div>${this.escapeHtml(lastChapter.title)}</div></a>` : ''}
                            </div>` : ''}
                            <p style="color:var(--text-secondary);font-size:13px;margin-bottom:12px;">Pilih chapter untuk dibaca. Setiap chapter terpisah.</p>
                            ${chaptersHTML || '<p style="color:var(--text-secondary);padding:20px;">No chapters available</p>'}
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        this.bindNavLinks();

        const bmBtn = document.getElementById('btnBookmark');
        if (bmBtn) {
            bmBtn.addEventListener('click', () => toggleBookmarkFromDetail(bmBtn));

    async loadChapter(slug) {
        try {
            this.showLoading();
            slug = decodeURIComponent(slug).replace(/\/+$/, '');
            slug = slug.replace(/^https?:\/\/[^/]+\//i, '');
            const data = await this.fetchJson(`/api/chapter/${encodeURIComponent(slug)}`);
            // Track read count for popular sidebar
            if (data.mangaSlug) { fetch('/api/track-read', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mangaSlug: data.mangaSlug }) }).catch(() => {}); }
            // Save reading history
            HistoryStore.add({
                chapterSlug: data.slug || slug,
                mangaSlug: data.mangaSlug || null,
                title: data.seriesTitle || data.title || slug,
                seriesTitle: data.seriesTitle || null,
                chapterTitle: data.title || null,
                chapterUrl: `/${data.slug || slug}`,
                seriesUrl: data.seriesUrl || (data.mangaSlug ? `/manga/${data.mangaSlug}` : null),
                image: null,
                chapterNumber: data.chapterNumber != null ? data.chapterNumber : null
            });
            // Try fill cover from local series later if available
            this.fillHistoryCover(data.mangaSlug || null, data.slug || slug);
            this.renderReader(data);
        } catch (err) {
            console.error('Chapter error:', err);
            this.renderError(err.message);
        }
    },

    async fillHistoryCover(mangaSlug, chapterSlug) {
        if (!mangaSlug) return;
        try {
            const data = await this.fetchJson(`/api/manga/${encodeURIComponent(mangaSlug)}`);
            if (!data || !data.image) return;
            const list = HistoryStore.getAll();
            let changed = false;
            for (const item of list) {
                if ((item.mangaSlug === mangaSlug || item.chapterSlug === chapterSlug) && !item.image) {
                    item.image = data.image;
                    if (!item.seriesTitle && data.title) item.seriesTitle = data.title;
                    if (!item.title && data.title) item.title = data.title;
                    changed = true;
                }
            }
            if (changed) HistoryStore.save(list);
        } catch (_) {}
    },

    renderReader(data) {
        const images = data.images || [];
        const imagesHTML = images.map((img, i) => 
            `<img src="${this.proxyImg(img)}" alt="Chapter page ${i + 1}" loading="lazy" class="chapter-img" onerror="this.style.display='none'">`
        ).join('');

        const chapters = data.chapters || [];
        const chapterOptions = chapters.map(ch => {
            const isCurrent = ch.slug === data.slug || ch.url === `/${data.slug}` || ch.url === data.slug;
            return `<option value="${ch.url}" ${isCurrent ? 'selected' : ''}>${this.escapeHtml(ch.title)}</option>`;
        }).join('');

        const hasPrev = data.prevChapter && !String(data.prevChapter).includes('#/');
        const hasNext = data.nextChapter && !String(data.nextChapter).includes('#/');
        const seriesUrl = data.seriesUrl || (data.mangaSlug ? `/manga/${data.mangaSlug}` : '/');
        const chLabel = data.chapterNumber != null ? `Chapter ${data.chapterNumber}` : 'Chapter';

        this.contentEl.innerHTML = `
            <div class="reader-container">
                <div style="margin-bottom:12px;">
                    <a href="#" data-url="${seriesUrl}" class="nav-link" style="color:var(--text-secondary);font-size:13px;">
                        <i class="fas fa-arrow-left"></i> ${this.escapeHtml(data.seriesTitle || 'Kembali ke Series')}
                    </a>
                </div>

                <h1 style="margin-bottom:8px;font-size:22px;">${this.escapeHtml(data.title)}</h1>
                <p style="color:var(--text-secondary);margin-bottom:16px;font-size:13px;">
                    ${chLabel} · ${images.length} halaman · dibaca terpisah per chapter
                </p>
                
                <div class="reader-nav">
                    ${hasPrev
                        ? `<a href="#" data-url="${data.prevChapter}" class="nav-link"><i class="fas fa-chevron-left"></i> Chapter Sebelumnya</a>`
                        : '<a class="disabled"><i class="fas fa-chevron-left"></i> Chapter Sebelumnya</a>'
                    }
                    ${chapters.length > 0 ? `
                    <select id="chapterSelect" class="chapter-select" aria-label="Pilih chapter">
                        ${chapterOptions}
                    </select>` : ''}
                    ${hasNext
                        ? `<a href="#" data-url="${data.nextChapter}" class="nav-link">Lanjut Chapter Berikutnya <i class="fas fa-chevron-right"></i></a>`
                        : '<a class="disabled">Lanjut Chapter Berikutnya <i class="fas fa-chevron-right"></i></a>'
                    }
                </div>

                <div class="reader-images">
                    ${imagesHTML || '<p style="color:var(--text-secondary);padding:40px;text-align:center;">Tidak ada gambar chapter</p>'}
                </div>

                <div class="reader-nav" style="margin-top:20px;">
                    ${hasPrev
                        ? `<a href="#" data-url="${data.prevChapter}" class="nav-link"><i class="fas fa-chevron-left"></i> Chapter Sebelumnya</a>`
                        : '<a class="disabled"><i class="fas fa-chevron-left"></i> Chapter Sebelumnya</a>'
                    }
                    ${hasNext
                        ? `<a href="#" data-url="${data.nextChapter}" class="nav-link">Lanjut Chapter Berikutnya <i class="fas fa-chevron-right"></i></a>`
                        : '<a class="disabled">Lanjut Chapter Berikutnya <i class="fas fa-chevron-right"></i></a>'
                    }
                </div>

                ${hasNext ? `
                <div style="text-align:center;margin-top:24px;">
                    <a href="#" data-url="${data.nextChapter}" class="nav-link" style="display:inline-block;background:var(--primary-color);color:#fff;padding:14px 28px;border-radius:8px;font-weight:700;">
                        Selesai Chapter ini? Lanjut Chapter Berikutnya →
                    </a>
                </div>` : ''}
            </div>
        `;
        
        this.bindNavLinks();

        const select = document.getElementById('chapterSelect');
        if (select) {
            select.addEventListener('change', (e) => {
                const url = e.target.value;
                if (url) navigate(null, url);
            });
        }

        this.injectChapterSchema(data);

    },

    bindNavLinks() {
        document.querySelectorAll('.nav-link:not([data-bound])').forEach(link => {
            link.setAttribute('data-bound', '1');
            const url = link.getAttribute('data-url');
            if (url && link.getAttribute('href') === '#') {
                link.setAttribute('href', url);
            }
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const url = this.getAttribute('data-url');
                navigate(e, url);
            });
        });
    },

    showLoading() {
        this.contentEl.innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading...</p>
            </div>
        `;
    },

    renderError(message) {
        this.contentEl.innerHTML = `
            <div class="error-state">
                <i class="fas fa-exclamation-triangle"></i>
                <p>Error: ${this.escapeHtml(message)}</p>
                <button class="retry-btn" onclick="location.reload()">Retry</button>
                <br><br>
                <a href="/" class="retry-btn" onclick="return navigate(event, '/')">Back to Home</a>
            </div>
        `;
    },
    
    async loadGenres() {
        try {
            this.showLoading();
            const data = await this.fetchJson('/api/genres');
            this.renderGenres(data);
        } catch (err) {
            console.error('Genres error:', err);
            this.renderError(err.message);
        }
    },

    renderGenres(data) {
        const genres = data.genres || [];
        const cards = genres.map(g => `
            <a href="#" class="genre-card nav-link" data-url="/genres/${g.slug}">
                <span class="gname">${this.escapeHtml(g.name)}</span>
                <span class="gcount">${g.count ? `<b>${g.count}</b> komik` : ''}</span>
            </a>
        `).join('');

        this.contentEl.innerHTML = `
            <div class="genre-page">
                <div class="genre-page-header">
                    <h2>Genre</h2>
                    <div class="gmeta">${genres.length} genre · dari data lokal</div>
                </div>
                <div class="genre-search">
                    <input type="text" id="genreFilterInput" placeholder="Cari genre..." autocomplete="off">
                </div>
                <div class="genre-grid" id="genreGrid">
                    ${cards || '<p style="color:var(--text-secondary);grid-column:1/-1;padding:30px;text-align:center;">Belum ada data genre. Jalankan scrap dulu.</p>'}
                </div>
            </div>
        `;

        this.bindNavLinks();

        const input = document.getElementById('genreFilterInput');
        const grid = document.getElementById('genreGrid');
        if (input && grid) {
            input.addEventListener('input', () => {
                const q = input.value.trim().toLowerCase();
                grid.querySelectorAll('.genre-card').forEach(card => {
                    const name = (card.querySelector('.gname')?.textContent || '').toLowerCase();
                    card.style.display = !q || name.includes(q) ? '' : 'none';
                });
            });
        }
    },

    async loadGenreDetail(slug, page = 1) {
        try {
            this.showLoading();
            slug = decodeURIComponent(slug).replace(/\/+$/, '');
            page = parseInt(page, 10) || 1;
            const data = await this.fetchJson(`/api/genres/${encodeURIComponent(slug)}?page=${page}`);
            this.renderGenreDetail(data);
        } catch (err) {
            console.error('Genre detail error:', err);
            this.renderError(err.message);
        }
    },

    renderGenreDetail(data) {
        const genre = data.genre || {};
        const page = data.pagination?.currentPage || 1;
        const totalPages = data.pagination?.totalPages || 1;
        const itemsHTML = (data.items || []).map(item => {
            const rating = item.rating || '7.00';
            return `
            <div class="bs styletere">
                <div class="bsx">
                    <a href="#" data-url="${item.url}" class="nav-link" title="${this.escapeHtml(item.title)}">
                        <div class="limit">
                            <span class="flag-jp">${this.escapeHtml(item.type || 'Manga')}</span>
                            <img src="${this.proxyImg(item.image)}" alt="${this.escapeHtml(item.title)}" loading="lazy"
                                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 285 425%22><rect fill=%22%23333%22 width=%22285%22 height=%22425%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23666%22 text-anchor=%22middle%22>No Image</text></svg>'">
                        </div>
                        <div class="bigor">
                            <div class="tt">${this.escapeHtml(item.title)}</div>
                            <div class="adds">
                                <div class="epxs">${this.escapeHtml(item.chapter || 'Chapter 1')}</div>
                                <div class="star-rating">
                                    <span class="stars">${this.starHtml(rating)}</span>
                                    <span class="numscore">${rating}</span>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>
            </div>`;
        }).join('');

        let pageBtns = '';
        if (totalPages > 1) {
            if (page > 1) pageBtns += `<button type="button" class="az-page-btn genre-page-btn" data-page="${page - 1}">« Prev</button>`;
            const start = Math.max(1, page - 2);
            const end = Math.min(totalPages, start + 4);
            for (let p = start; p <= end; p++) {
                pageBtns += `<button type="button" class="az-page-btn genre-page-btn ${p === page ? 'active' : ''}" data-page="${p}">${p}</button>`;
            }
            if (page < totalPages) pageBtns += `<button type="button" class="az-page-btn genre-page-btn" data-page="${page + 1}">Next »</button>`;
        }

        this.contentEl.innerHTML = `
            <div class="genre-page">
                <div style="margin-bottom:12px;">
                    <a href="#" data-url="/genres" class="nav-link" style="color:var(--text-secondary);font-size:13px;">
                        <i class="fas fa-arrow-left"></i> Semua Genre
                    </a>
                </div>
                <div class="genre-page-header">
                    <h2>${this.escapeHtml(genre.name || 'Genre')}</h2>
                    <div class="gmeta"><b>${genre.count || 0}</b> komik · halaman ${page}/${totalPages}</div>
                </div>
                <div class="listupd">
                    ${itemsHTML || '<p style="color:var(--text-secondary);padding:30px;grid-column:1/-1;text-align:center;">Tidak ada komik di genre ini.</p>'}
                </div>
                ${pageBtns ? `<div class="az-pagination">${pageBtns}</div>` : ''}
            </div>
        `;

        this.bindNavLinks();

        document.querySelectorAll('.genre-page-btn[data-page]').forEach(btn => {
            btn.addEventListener('click', () => {
                const p = parseInt(btn.getAttribute('data-page'), 10);
                const slug = genre.slug || '';
                window.history.pushState({}, '', `/genres/${encodeURIComponent(slug)}?page=${p}`);
                this.loadGenreDetail(slug, p);
                window.scrollTo(0, 0);
            });
        });
    },

    async loadAZ(show = 'A', page = 1) {
        try {
            this.showLoading();
            show = String(show || 'A').toUpperCase();
            page = parseInt(page, 10) || 1;
            const data = await this.fetchJson(`/api/az?show=${encodeURIComponent(show)}&page=${page}`);
            this.renderAZ(data);
        } catch (err) {
            console.error('AZ error:', err);
            this.renderError(err.message);
        }
    },

    renderAZ(data) {
        const keys = ['#', '0-9', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')];
        const show = data.show || 'A';
        const counts = data.counts || {};
        const page = data.pagination?.currentPage || 1;
        const totalPages = data.pagination?.totalPages || 1;

        const filtersHTML = keys.map(k => {
            const count = counts[k] || 0;
            const active = k === show ? 'active' : '';
            return `<button type="button" class="az-btn ${active}" data-az="${k}">${k}</button>`;
        }).join('');

        const itemsHTML = (data.items || []).map(item => {
            const rating = item.rating || '7.00';
            return `
            <div class="bs styletere">
                <div class="bsx">
                    <a href="#" data-url="${item.url}" class="nav-link" title="${this.escapeHtml(item.title)}">
                        <div class="limit">
                            <span class="flag-jp">${this.escapeHtml(item.type || 'Manga')}</span>
                            <img src="${this.proxyImg(item.image)}" alt="${this.escapeHtml(item.title)}" loading="lazy"
                                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 285 425%22><rect fill=%22%23333%22 width=%22285%22 height=%22425%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23666%22 text-anchor=%22middle%22>No Image</text></svg>'">
                        </div>
                        <div class="bigor">
                            <div class="tt">${this.escapeHtml(item.title)}</div>
                            <div class="adds">
                                <div class="epxs">${this.escapeHtml(item.chapter || 'Chapter 1')}</div>
                                <div class="star-rating">
                                    <span class="stars">${this.starHtml(rating)}</span>
                                    <span class="numscore">${rating}</span>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>
            </div>`;
        }).join('');

        // Build pagination like screenshot: 1 2 3 ... last Next
        let pageBtns = '';
        const maxButtons = 5;
        let start = Math.max(1, page - 1);
        let end = Math.min(totalPages, start + maxButtons - 1);
        if (end - start < maxButtons - 1) start = Math.max(1, end - maxButtons + 1);

        for (let p = start; p <= end; p++) {
            pageBtns += `<button type="button" class="az-page-btn ${p === page ? 'active' : ''}" data-page="${p}">${p}</button>`;
        }
        if (end < totalPages) {
            if (end < totalPages - 1) pageBtns += `<button type="button" class="az-page-btn" disabled>…</button>`;
            pageBtns += `<button type="button" class="az-page-btn" data-page="${totalPages}">${totalPages}</button>`;
        }
        if (page < totalPages) {
            pageBtns += `<button type="button" class="az-page-btn" data-page="${page + 1}">Next »</button>`;
        }
        if (page > 1) {
            pageBtns = `<button type="button" class="az-page-btn" data-page="${page - 1}">« Prev</button>` + pageBtns;
        }

        this.contentEl.innerHTML = `
            <div class="az-wrap">
                <div class="az-header">
                    <h2>AZ Lists</h2>
                    <div class="az-filters">${filtersHTML}</div>
                    <div class="az-meta">Huruf <strong>${show}</strong> · ${data.total || 0} komik · halaman ${page}/${totalPages}</div>
                </div>
                <div class="listupd">
                    ${itemsHTML || '<p style="color:var(--text-secondary);padding:30px;grid-column:1/-1;text-align:center;">Tidak ada komik untuk filter ini.</p>'}
                </div>
                ${totalPages > 1 ? `<div class="az-pagination">${pageBtns}</div>` : ''}
            </div>
        `;

        this.bindNavLinks();

        document.querySelectorAll('.az-btn:not(:disabled)').forEach(btn => {
            btn.addEventListener('click', () => {
                const letter = btn.getAttribute('data-az');
                window.history.pushState({}, '', `/az-lists?show=${encodeURIComponent(letter)}&page=1`);
                this.loadAZ(letter, 1);
                window.scrollTo(0, 0);
            });
        });

        document.querySelectorAll('.az-page-btn[data-page]').forEach(btn => {
            btn.addEventListener('click', () => {
                const p = parseInt(btn.getAttribute('data-page'), 10);
                window.history.pushState({}, '', `/az-lists?show=${encodeURIComponent(show)}&page=${p}`);
                this.loadAZ(show, p);
                window.scrollTo(0, 0);
            });
        });
    },

    proxyImg(url) {
        if (!url || url.startsWith('data:')) return url || '';
        return '/api/proxy?url=' + encodeURIComponent(url);
    },
    injectMangaSchema(data, slug) {
        const old = document.getElementById('manga-schema');
        if (old) old.remove();
        const chapters = (data.chapters || []).slice(0, 20);
        const schema = {
            "@context": "https://schema.org",
            "@type": "BookSeries",
            "name": data.title,
            "url": `https://micinime.my.id/manga/${slug}`,
            "image": data.image || '',
            "genre": (data.genres || []).map(g => g.name || g).join(', '),
            "description": data.description || '',
            "inLanguage": "id-ID",
            "potentialAction": {
                "@type": "ReadAction",
                "target": `https://micinime.my.id/manga/${slug}`
            }
        };
        if (data.rating) {
            schema.aggregateRating = {
                "@type": "AggregateRating",
                "ratingValue": data.rating,
                "bestRating": "10",
                "ratingCount": Math.floor(Math.random() * 500 + 50)
            };
        }
        if (chapters.length) {
            schema.hasPart = chapters.map(ch => ({
                "@type": "ComicIssue",
                "name": ch.title,
                "url": `https://micinime.my.id${ch.url}`,
                "position": chapters.indexOf(ch) + 1
            }));
        }
        const breadcrumb = {
            "@context": "https://schema.org",
            "@type": "BreadcrumbList",
            "itemListElement": [
                { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://micinime.my.id/" },
                { "@type": "ListItem", "position": 2, "name": data.title, "item": `https://micinime.my.id/manga/${slug}` }
            ]
        };
        const s1 = document.createElement('script');
        s1.type = 'application/ld+json';
        s1.id = 'manga-schema';
        s1.textContent = JSON.stringify(schema);
        document.head.appendChild(s1);
        const s2 = document.createElement('script');
        s2.type = 'application/ld+json';
        s2.id = 'manga-breadcrumb';
        s2.textContent = JSON.stringify(breadcrumb);
        document.head.appendChild(s2);
        const cw = {
            "@context": "https://schema.org",
            "@type": "CreativeWork",
            "name": data.title,
            "url": `https://micinime.my.id/manga/${slug}`,
            "image": data.image || '',
            "description": data.description || '',
            "genre": (data.genres || []).map(g => g.name || g).join(', '),
            "inLanguage": "id-ID",
            "dateModified": data.scrapedAt || new Date().toISOString()
        };
        const s3 = document.createElement('script');
        s3.type = 'application/ld+json';
        s3.id = 'manga-creative';
        s3.textContent = JSON.stringify(cw);
        document.head.appendChild(s3);
        document.title = `${data.title} | Micinime`;
    },
    injectChapterSchema(data) {
        const old = document.getElementById('chapter-schema');
        if (old) old.remove();
        const seriesUrl = data.seriesUrl || (data.mangaSlug ? `/manga/${data.mangaSlug}` : '');
        const schema = {
            "@context": "https://schema.org",
            "@type": "ComicIssue",
            "name": data.title,
            "url": `https://micinime.my.id${location.pathname}`,
            "isPartOf": {
                "@type": "ComicSeries",
                "name": data.seriesTitle || '',
                "url": seriesUrl ? `https://micinime.my.id${seriesUrl}` : ''
            },
            "position": data.chapterNumber || 1,
            "numberOfPages": (data.images || []).length
        };
        const breadcrumb = {
            "@context": "https://schema.org",
            "@type": "BreadcrumbList",
            "itemListElement": [
                { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://micinime.my.id/" },
                { "@type": "ListItem", "position": 2, "name": data.seriesTitle || "Series", "item": seriesUrl ? `https://micinime.my.id${seriesUrl}` : '' },
                { "@type": "ListItem", "position": 3, "name": data.title }
            ]
        };
        const s1 = document.createElement('script');
        s1.type = 'application/ld+json';
        s1.id = 'chapter-schema';
        s1.textContent = JSON.stringify(schema);
        document.head.appendChild(s1);
        const s2 = document.createElement('script');
        s2.type = 'application/ld+json';
        s2.id = 'chapter-breadcrumb';
        s2.textContent = JSON.stringify(breadcrumb);
        document.head.appendChild(s2);
        const wp = {
            "@context": "https://schema.org",
            "@type": "WebPage",
            "name": data.title,
            "url": `https://micinime.my.id${location.pathname}`,
            "isPartOf": { "@type": "WebSite", "name": "micinime", "url": "https://micinime.my.id/" },
            "inLanguage": "id-ID"
        };
        const s3 = document.createElement('script');
        s3.type = 'application/ld+json';
        s3.id = 'chapter-webpage';
        s3.textContent = JSON.stringify(wp);
        document.head.appendChild(s3);
        document.title = `${data.title} | Micinime`;
    },
    escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
};

// Pagination helper
function loadPage(page, type = 'manga') {
    window.history.pushState({}, '', `/manga?type=${encodeURIComponent(type)}&page=${page}`);
    router.loadList(page, type);
    window.scrollTo(0, 0);
}

function loadAZPage(show, page) {
    window.history.pushState({}, '', `/az-lists?show=${encodeURIComponent(show)}&page=${page}`);
    router.loadAZ(show, page);
    window.scrollTo(0, 0);
}

// Handle browser back/forward
window.onpopstate = () => {
    router.routes();
};

// Clean Chatango notification dots from title
setInterval(() => {
    if (document.title && (document.title.includes('\u{1F534}') || document.title.includes('\u{1F7E2}'))) {
        document.title = document.title.replace(/[\u{1F534}\u{1F7E2}\u{1F535}\u{1F7E1}\u{1F7E3}\u{1F7E4}]/gu, '').replace(/^\s+/, '').trim();
    }
}, 1000);

// Search form handler
document.getElementById('searchForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const query = document.getElementById('searchInput').value.trim();
    if (query) {
        window.history.pushState({}, '', `/?s=${encodeURIComponent(query)}`);
        router.loadSearch(query);
        document.querySelector('.minmb')?.classList.remove('minmbx');
    }
});

// Initialize app
router.init();
BookmarkStore.updateBadge();
HistoryStore.updateBadge();
</script>
