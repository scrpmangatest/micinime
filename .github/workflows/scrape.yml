name: Scrape and deploy

on:
  schedule:
    - cron: "0 17,23 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Manga detail batch size per run"
        required: false
        default: "120"
      max_batches:
        description: "Max detail batches to run"
        required: false
        default: "10"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      SCRAPE_DELAY_MS: "3000"
      SCRAPE_MAX_MS: "3600000"
      SCRAPE_LATEST_PAGES: "4"
      SCRAPE_BASE_URL: "https://komiktap.info"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run scheduled scraper (incremental catalog)
        run: node scrape-scheduled.js

      - name: Backfill manga details (batched)
        env:
          BATCH_SIZE: ${{ inputs.batch_size || '120' }}
          DELAY_MS: "1500"
        run: |
          MAX_BATCHES=${{ inputs.max_batches || '10' }}
          for i in $(seq 1 $MAX_BATCHES); do
            echo "=== Detail batch $i/$MAX_BATCHES ==="
            node scrape-details.js || true
            REMAIN=$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('data/komiktap.json','utf8'));const ex=new Set(fs.readdirSync('data/manga').map(f=>f.replace('.json','')));console.log(d.items.filter(x=>!ex.has(x.slug)).length)" 2>/dev/null || echo 999)
            echo "Remaining: $REMAIN"
            if [ "$REMAIN" = "0" ]; then break; fi
            if [ "$REMAIN" = "999" ]; then break; fi
          done

      - name: Stage and commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data -f
          if git diff --cached --quiet; then
            echo "No data changes detected."
          else
            git commit -m "Update data after scrape [skip ci]"
            git pull --rebase origin main || (git fetch origin && git rebase origin/main)
            git push
          fi
