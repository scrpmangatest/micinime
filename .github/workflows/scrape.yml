name: Scrape and deploy

on:
  schedule:
    - cron: "0 17,23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      SCRAPE_DELAY_MS: "3000"
      SCRAPE_MAX_MS: "3600000"
      SCRAPE_LATEST_PAGES: "4"
      SCRAPE_BASE_URL: "https://komiktap.info"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run scheduled scraper
        run: node scrape-scheduled.js

      - name: Stage and commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data -f
          if git diff --cached --quiet; then
            echo "No data changes detected."
          else
            git commit -m "Update data after scrape"
            git push
          fi
